name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p itp-cli -p itp-lsp

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/itp dist/
          cp target/${{ matrix.target }}/release/itp-grep dist/ || true
          cp target/${{ matrix.target }}/release/itp-sed dist/ || true
          cp target/${{ matrix.target }}/release/itp-awk dist/ || true
          cp target/${{ matrix.target }}/release/itp-lsp dist/ || true
          cp README.md LICENSE dist/ || true
          tar czf itp-${{ matrix.target }}.tar.gz -C dist .

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/itp.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/itp-grep.exe" dist/ -ErrorAction SilentlyContinue
          Copy-Item "target/${{ matrix.target }}/release/itp-sed.exe" dist/ -ErrorAction SilentlyContinue
          Copy-Item "target/${{ matrix.target }}/release/itp-awk.exe" dist/ -ErrorAction SilentlyContinue
          Copy-Item "target/${{ matrix.target }}/release/itp-lsp.exe" dist/ -ErrorAction SilentlyContinue
          Copy-Item "README.md" dist/ -ErrorAction SilentlyContinue
          Copy-Item "LICENSE" dist/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath "itp-${{ matrix.target }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: itp-${{ matrix.target }}
          path: itp-${{ matrix.target }}.${{ matrix.archive }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  wasm-release:
    name: Build WASM Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: wasm-pack build src/itp-wasm --target web --out-dir ../../pkg
      - uses: actions/upload-artifact@v4
        with:
          name: itp-wasm-pkg
          path: pkg/
